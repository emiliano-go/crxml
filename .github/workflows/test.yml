name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev

      - name: Build and install with default features
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          pip install maturin
          maturin build --features mmap --out /tmp/wheels -i python
          pip install /tmp/wheels/crxml-*.whl
          pip install pytest pyarrow pandas polars

      - name: Run test suite (default features)
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          python -m pytest tests/ -v --tb=short -x -k "not hardening and not columnar_export"

      - name: Build and install with testing feature
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          maturin build --features testing,mmap --out /tmp/wheels -i python
          pip install /tmp/wheels/crxml-*.whl
          pip install pytest pyarrow pandas polars

      - name: Run full suite (including hardening harness)
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          python -m pytest tests/ -v --tb=short -x

      - name: Run benchmarks
        if: github.ref == 'refs/heads/main'
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          python -m pytest tests/ --run-bench -v --tb=short
