name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Checkout rypipe (path dependency)
        uses: actions/checkout@v4
        with:
          repository: emiliano-go/rypipe
          path: ../../../rypipe

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install (testing feature, includes columnar)
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          pip install maturin pytest pyarrow pandas polars
          pip install rypipe
          maturin build --features testing --out /tmp/wheels -i python
          pip install /tmp/wheels/crxml-*.whl

      - name: Run full suite (including hardening harness)
        run: |
          python -m pytest tests/ -v --tb=short -x

      - name: Run benchmarks
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          python -m pytest tests/ --run-bench -v --tb=short

  default-features:
    # Feature-gating check: the plain build (no columnar/testing) must
    # still compile and pass the stream-engine tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout rypipe (path dependency)
        uses: actions/checkout@v4
        with:
          repository: emiliano-go/rypipe
          path: ../../../rypipe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install with default features
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          pip install maturin pytest pyarrow pandas polars
          pip install rypipe
          maturin build --out /tmp/wheels -i python
          pip install /tmp/wheels/crxml-*.whl

      - name: Run test suite (default features)
        run: |
          python -m pytest tests/ -v --tb=short -x -k "not hardening and not columnar_export"
