[build-system]
# Requires Rust toolchain (rustc + cargo) installed on the build machine.
# Install from https://rustup.rs if not present.
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "crxml"
version = "1.1.0"
description = "High-performance Crystal Reports XML to Arrow/DataFrame engine for Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Emiliano Gandini", email = "emiliano.gandini@protonmail.com"}
]
keywords = ["crystal-reports", "xml", "parser", "pandas", "etl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup :: XML",
]
requires-python = ">=3.10"
# No runtime dependencies: pyarrow/pandas/polars are optional extras,
# imported only by the sink methods that need them.
dependencies = []

[project.optional-dependencies]
rypipe = ["rypipe>=0.1.0"]
pyarrow = ["pyarrow>=15"]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
all = ["crxml[rypipe,pyarrow,pandas,polars]"]
docs = [
    # seoslug is a docs-site plugin dependency (zensical), not a runtime dep
    "seoslug>=2.0.1",
]
dev = [
    "pytest>=7",
    "pytest-benchmark>=4",
    "openpyxl>=3.1",
    "crxml[all]",
]

[project.urls]
Homepage = "https://github.com/emiliano-go/crxml"
Repository = "https://github.com/emiliano-go/crxml"
Issues = "https://github.com/emiliano-go/crxml/issues"

[tool.maturin]
# The Rust crate is in src/crxml_core/
manifest-path = "src/crxml_core/Cargo.toml"
# The compiled extension will be accessible as crxml._crxml_core
module-name = "crxml._crxml_core"
# Include the Python package from src/crxml/ alongside the compiled extension
python-source = "src"
# Build in release mode for maximum performance
features = ["pyo3/extension-module"]
profile = "release"
# To build with profiling symbols:
#   maturin build --profile profiling
# Build with: maturin build --release --manylinux 2014 --zig -o dist
# (PEP 517 `python -m build` does not support manylinux flags)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "bench: tests that use large benchmark files (50/100 MB)",
]
