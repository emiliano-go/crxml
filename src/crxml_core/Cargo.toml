[package]
name = "crxml-core"
# Keep in sync with the crxml Python package version (pyproject.toml)
version = "2.1.0"
edition = "2021"
description = "High-performance Crystal Reports XML to Arrow/DataFrame engine for Python"
license = "MIT"
repository = "https://github.com/emiliano-go/crxml"
authors = ["Emiliano Gandini <emiliano.gandini@protonmail.com>"]

[lib]
name = "_crxml_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
profile = ["rypipe-core/profile"]
testing = []
alloc-stats = ["rypipe-core/alloc-stats"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
quick-xml = "0.36"
rustc-hash = "2"
# Pinned exactly: the Arrow C Data Interface (FFI_ArrowSchema) is not
# stable across minor versions; bump only after testing both directions.
arrow = { version = "=55.2.0", default-features = false, features = ["pyarrow"] }

rypipe-core = { git = "https://github.com/emiliano-go/rypipe", tag = "v2.2.0", subdirectory = "crates/rypipe-core", features = ["mmap"] }

# Crystal Reports XML adapter dependencies (previously in rypipe-xml).
memchr = "2"
simdutf8 = "0.1"
thiserror = "2"
rayon = "1"

# Fast allocator: replaces the Windows system heap for all Rust-side
# allocations (profiling showed ~27% of CPU in RtlAllocateHeap/malloc)
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Profiling build: full debug symbols, no strip
[profile.profiling]
inherits = "release"
debug = 2
strip = false
panic = "unwind"

# Fast iteration: thin LTO, line tables for perf, no fat-LTO IO hog
[profile.perf]
inherits = "release"
lto = "thin"
codegen-units = 4
debug = 1
split-debuginfo = "unpacked"

[profile.dev]
opt-level = 1
