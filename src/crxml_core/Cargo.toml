[package]
name = "crxml-core"
version = "0.2.0"
edition = "2021"
description = "Fast streaming Crystal Reports XML parser for Python"
license = "MIT"
repository = "https://github.com/emiliano-go/crxml"
authors = ["Emiliano Gandini <emiliano.gandini@protonmail.com>"]

[lib]
name = "_crxml_core"
crate-type = ["cdylib"]

[features]
default = []
columnar = ["dep:rayon", "dep:arrow"]
mmap = ["dep:memmap2"]
profile = []

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
quick-xml = "0.36"
memchr = "2"
lexical = "7"
rustc-hash = "2"
rayon = { version = "1", optional = true }
memmap2 = { version = "0.9", optional = true }
arrow = { version = "=55.2.0", default-features = false, features = ["pyarrow"], optional = true }
mimalloc = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
