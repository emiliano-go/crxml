[package]
name = "crxml-core"
version = "0.2.0"
edition = "2021"
description = "Fast streaming Crystal Reports XML parser for Python"
license = "MIT"
repository = "https://github.com/emiliano-go/crxml"
authors = ["Emiliano Gandini <emiliano.gandini@protonmail.com>"]

[lib]
name = "_crxml_core"
crate-type = ["cdylib"]

[features]
default = []
# Columnar engine: build typed arrays in Rust, export via PyArrow
columnar = ["dep:rayon", "dep:arrow"]
# Memory-map input files (carries the only unsafe in the crate)
mmap = ["dep:memmap2"]
profile = []

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
quick-xml = "0.36"
memchr = "2"

# SIMD UTF-8 validation: chunks are validated once up front so the parse
# path can use from_utf8_unchecked instead of revalidating per value
simdutf8 = "0.1"
lexical = "7"
rustc-hash = "2"
rayon = { version = "1", optional = true }
memmap2 = { version = "0.9", optional = true }
arrow = { version = "=55.2.0", default-features = false, features = ["pyarrow"], optional = true }

# Fast allocator: replaces the Windows system heap for all Rust-side
# allocations (profiling showed ~27% of CPU in RtlAllocateHeap/malloc)
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Profiling build: full debug symbols, no strip
[profile.profiling]
inherits = "release"
debug = 2
strip = false
panic = "unwind"

[profile.dev]
opt-level = 1
